plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iotower.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.iotower.android'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':core')
}
